# Code and results stay in the project directory mounted at /work; libraries live only in the image.
x-common: &common
  volumes:
    - .:/work
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

services:
  experiments:
    <<: *common
    build:
      context: .
      target: experiments
    image: spatial-representation/experiments:1.0
    # Same limits as the original run (8 CPUs, 8 GiB) to ease comparison; CI lowers the CPU limit.
    cpus: ${EXPERIMENT_CPUS:-8}
    mem_limit: 8g
    network_mode: none

  publish:
    <<: *common
    build:
      context: .
      target: publish
    image: spatial-representation/publish:1.0
    network_mode: none
